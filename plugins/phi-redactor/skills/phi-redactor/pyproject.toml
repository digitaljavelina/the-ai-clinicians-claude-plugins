[project]
name = "phi-redactor"
version = "1.0.0"
description = "De-identify PHI in clinical text using Presidio + a clinical NER transformer (obi/deid_roberta_i2b2). Clinical engine by default."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faker>=40.36.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "spacy>=3.8.13",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "pypdf>=6.1.3",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    # The spaCy model Presidio's baseline NER uses. Pinned as a real dependency so
    # `uv sync` tracks it (never prunes it) and caches its wheel, which keeps the
    # offline guarantee intact and stops it from silently re-downloading.
    "en-core-web-lg",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
